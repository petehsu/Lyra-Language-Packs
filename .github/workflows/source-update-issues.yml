name: Reconcile and publish source updates

on:
  repository_dispatch:
    types: [lyra-source-updated]

permissions:
  contents: write

concurrency:
  group: reconcile-language-pack-source
  cancel-in-progress: false

jobs:
  open-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: petehsu/Lyra
          ref: ${{ github.event.client_payload.commit }}
          path: lyra-source
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lyra-source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: lyra-source
      - run: pnpm exec tsx tools/generate-language-pack-source-manifest.ts --output "$RUNNER_TEMP/source-manifest.v1.json"
        working-directory: lyra-source
      - name: Reconcile packs with English fallbacks for changed source keys
        run: node scripts/reconcile-source.mjs "$RUNNER_TEMP/source-manifest.v1.json"
      - run: node scripts/validate.mjs
      - name: Commit reconciled source
        env:
          SOURCE_COMMIT: ${{ github.event.client_payload.commit }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "lyra-language-pack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packs source pack-metadata.json pack-baselines.json
          git commit -m "chore: sync Lyra language source ${SOURCE_COMMIT}"
          git push origin HEAD:main
      - run: node scripts/build-release.mjs --out dist
        env:
          LYRA_LANGUAGE_PACKS_ED25519_PRIVATE_KEY: ${{ secrets.LYRA_LANGUAGE_PACKS_ED25519_PRIVATE_KEY }}
      - name: Publish source-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_hash="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("source/source-manifest.v1.json","utf8")).contentHash)')"
          tag="source-${source_hash}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes "Official signed Lyra language packs for source ${source_hash}."
          fi
