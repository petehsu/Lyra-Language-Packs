name: Publish signed Official language packs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == 'petehsu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/build-release.mjs --out dist
        env:
          LYRA_LANGUAGE_PACKS_ED25519_PRIVATE_KEY: ${{ secrets.LYRA_LANGUAGE_PACKS_ED25519_PRIVATE_KEY }}
      - run: gh release create "${{ inputs.tag }}" dist/* --title "${{ inputs.tag }}" --notes "Official signed Lyra language packs."
        env:
          GH_TOKEN: ${{ github.token }}
