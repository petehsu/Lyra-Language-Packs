name: Publish signed Official language packs

on:
  push:
    branches: [main]
    paths:
      - packs/**
      - source/**
      - pack-metadata.json
      - pack-baselines.json
      - scripts/**
  workflow_dispatch:

concurrency:
  group: publish-language-packs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == 'petehsu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/build-release.mjs --out dist
        env:
          LYRA_LANGUAGE_PACKS_ED25519_PRIVATE_KEY: ${{ secrets.LYRA_LANGUAGE_PACKS_ED25519_PRIVATE_KEY }}
      - name: Publish source-addressed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_hash="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync("source/source-manifest.v1.json","utf8")).contentHash)')"
          tag="source-${source_hash}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes "Official signed Lyra language packs for source ${source_hash}."
          fi
